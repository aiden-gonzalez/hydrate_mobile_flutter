name: hydrate_mobile_flutter
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  camera: ^0.10.6
  path_provider: ^2.1.5
  path: ^1.9.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  flutter_zustand: ^0.0.5
  flutter_dotenv: ^5.2.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - .env
